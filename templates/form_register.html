<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <div class="flex min-h-screen items-center justify-center px-4">
        <div class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/90 p-8 shadow-2xl shadow-slate-950/60 backdrop-blur-sm">
            <div class="mb-8 text-center">
                <p class="text-xs uppercase tracking-[0.35em] text-violet-300">Mi diario</p>
                <h1 class="mt-4 text-3xl font-bold text-white">Crear cuenta</h1>
            </div>

            <form id="formulario-login" class="space-y-5">
                <div>
                    <label for="nombre" class="mb-2 block text-sm font-medium text-slate-300">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre" class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 focus:border-violet-400 focus:outline-none">
                </div>

                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-300">Correo</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 focus:border-violet-400 focus:outline-none">
                </div>

                <div>
                    <label for="contraseña" class="mb-2 block text-sm font-medium text-slate-300">Contraseña</label>
                    <input type="password" id="contraseña" placeholder="••••••••" class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 focus:border-violet-400 focus:outline-none">
                </div>

                <button id="registrarUsuario" type="button" class="w-full rounded-xl bg-violet-500 px-4 py-3 font-semibold text-white shadow-lg shadow-violet-600/30 transition hover:bg-violet-400 hover:shadow-violet-500/20">
                    Crear cuenta
                </button>

                <p class="text-center text-sm text-slate-400">
                    ¿Ya tienes cuenta?
                    <a href="/index.html" class="font-medium text-violet-300 hover:text-violet-200">Inicia sesión</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module" src="../scripts/autenticacion.js"></script>
</body>
</html>
