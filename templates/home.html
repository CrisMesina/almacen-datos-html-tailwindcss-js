<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-hidden">
    <h1 id="nombre-usuario" class="ml-25 text-2xl font-bold italic my-2"></h1>
    <div class="flex">
        <div class="relative">
            <aside id="sidebar" class="sidebar-collapsed fixed left-0 top-0 z-40 h-screen overflow-hidden bg-slate-900/90 border-r border-slate-700 shadow-2xl shadow-slate-950/60 transition-all duration-300 ease-in-out">
                <div class="flex items-center justify-between px-4 py-5 border-b border-slate-700">
                    <button id="toggleSidebar" class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 transition-colors" aria-label="Abrir menú" aria-expanded="false">
                        ☰
                    </button>
                </div>

                <nav class="mt-6 space-y-2 px-3">

                    <button id="btnAbrirForm" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-3 text-slate-300 transition hover:bg-slate-800">
                        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-cyan-500/20 text-lg">
                            <img src="/images/notepad.svg" alt="">
                        </span>
                        <span class="nav-label whitespace-nowrap opacity-0 transition-opacity duration-300">Notas</span>
                    </button>

                    <button id="notas" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-3 text-slate-300 transition hover:bg-red-500/10">
                        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-500/10 text-lg">
                            <img src="/images/notes.svg" alt="">
                        </span>
                        <span class="nav-label whitespace-nowrap opacity-0 transition-opacity duration-300">Ver todas las Notas</span>
                    </button>

                    <button id="notasPersonales" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-3 text-slate-300 transition hover:bg-red-500/10">
                        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-500/10 text-lg">
                            <img src="/images/personal-notes.svg" alt="">
                        </span>
                        <span class="nav-label whitespace-nowrap opacity-0 transition-opacity duration-300">Mis Notas</span>
                    </button>

                    <div class="my-6 border-t border-slate-700"></div>

                    <button id="logoutButton" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-3 text-red-300 transition hover:bg-red-500/10">
                        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-500/10 text-lg">
                            <img src="/images/logout.svg" alt="">
                        </span>
                        <span class="nav-label whitespace-nowrap opacity-0 transition-opacity duration-300">Cerrar sesión</span>
                    </button>
                </nav>
            </aside>
            <div id="contenedorHome"></div>
        </div>
        <div id="mostrar-notas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
        </div>
    </div>
    <script type="module" src="../scripts/autenticacion.js"></script>
    <script src="/scripts/home.js"></script>
</body>
</html>
